[theme]
base = "light"
primaryColor = "#6155c9"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f8fc"
textColor = "#20253b"
borderColor = "#e4e6f0"
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
font = "sans-serif"
baseFontSize = 15
headingFontSizes = ["38px", "28px", "22px", "19px", "16px", "14px"]
headingFontWeights = [700, 650, 600, 600, 600, 500]
chartCategoricalColors = ["#6155c9", "#8b83dc", "#36a89a", "#d49446"]

[theme.sidebar]
backgroundColor = "#f7f8fc"
secondaryBackgroundColor = "#eeeff8"

[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false
